architecture: replication

auth:
  enabled: true
  password: redis123

# ✅ ENABLE SENTINEL (KEY CHANGE)
sentinel:
  enabled: true
  quorum: 2

# ✅ PREVENT MULTIPLE REDIS PODS FROM DYING TOGETHER
pdb:
  create: true
  minAvailable: 2

master:
  persistence:
    enabled: true
    size: 8Gi
    storageClass: standard

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis
          topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  extraFlags:
    - "--appendonly yes"
    - "--appendfsync everysec"

replica:
  replicaCount: 2

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis
          topologyKey: kubernetes.io/hostname

  persistence:
    enabled: true
    size: 8Gi
    storageClass: standard

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

