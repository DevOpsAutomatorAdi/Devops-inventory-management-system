architecture: replication

auth:
  enabled: true
  password: redis123

master:
  persistence:
    enabled: true
    size: 8Gi
    storageClass: gp2

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  extraFlags:
    - "--appendonly yes"
    - "--appendfsync everysec"

replica:
  replicaCount: 2

  persistence:
    enabled: true
    size: 8Gi
    storageClass: gp2

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

